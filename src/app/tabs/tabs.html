   <tabs-tab-group>
    @for (tabTitle of tabsStateService.tabTitles(); track $index; let i = $index) {
      <tabs-tab
        class="tabs_tab"
        (click)="activateTab(i)"
        [style.backgroundColor]="
          i === activeTab()
            ? 'var(--primary-color)'
            : disabledSingleState()[i] === false
              ? 'var(--inactive-color)'
              : 'var(--secondary-color)'
        "
        [style.color]="
          i === activeTab()
            ? 'var(--font-primary-color)'
            : disabledSingleState()[i] === false
              ? 'var(--font-disabled-tab-color)'
              : 'var(--font-enabled-tab-color)'
        "
        [style.pointerEvents]="disabledSingleState()[i] === false ? 'none' : 'auto'"
        [label]="i === 4 ? 'new tab' : tab"
        [disabled]="disabledSingleState()[i]"
        [title]="tabTitle"
        [active]="i === activeTab()"
        [sizeTitle]="tabsStateService.defaultTabsTitleSize()[i]"
        (sizeTitleChange)="setTabTitleSize(i, $event)"
      >
        <ng-container *ngIf="i === activeTab(); else templateA"
          ><p class="tabs_text">
            i'm active and full of life <strong>{{ tabOrderName[i] }}</strong> tab and in ng-container
          </p></ng-container
        >
        <ng-template #templateA>
          <strong>{{ tabOrderName[i] }}</strong>
        </ng-template>
        <button
          class="tab_button"
          button="type"
          (click)="toggleSingleTab(i)"
          [disabled]="i === activeTab()"
          [style.pointerEvents]="i === activeTab() ? 'none' : 'auto'"
        >
          {{ disabledSingleState()[i] === true ? 'disable' : 'enable' }}
        </button>
      </tabs-tab>
    }
  </tabs-tab-group>
  <ng-container>
    <tabs-active-content>
      <p class="tabs_textarea-name">
        here projected content of the {{ tabOrderName[activeTab()] }} active tab goes
      </p>
      <textarea
        class="tabs_textarea"
        [value]="tabTextarea()[activeTab()]"
        (input)="updateTabTextarea($event)"
      ></textarea>
    </tabs-active-content>
  </ng-container>
  <button (click)="toggleAllTabs()" type="button" class="tabs_button">
    {{ buttonName }}
  </button>
  <ng-container *ngTemplateOutlet="templateTab"></ng-container>
  <ng-template #templateTab>
    <tabs-control-buttons></tabs-control-buttons>
  </ng-template>
