<div class="tab" #tab>
  <h2 [style.font-size.px]="sizeTitle()">{{ title() }}</h2>
  <p>{{ label() }}</p>
  <ng-container *ngIf="index() === tabsStateService.activeTab(); else templateA">
    <mat-icon [style.color]="'yellow'">{{ tabsStateService.tabIcons()[index()] }}</mat-icon>
  </ng-container>
  <ng-template #templateA>
    <mat-icon>{{ tabsStateService.tabIcons()[index()] }}</mat-icon>
  </ng-template>
  <ng-content>Default tab</ng-content>
</div>
