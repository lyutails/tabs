<div class="tabs_titles-buttons">
  @let buttonName = 'reset names';
  <button
    tabs-reset
    [buttonName]="buttonName"
    aria-label="Reset tabs names"
    class="tabs_reset-names"
    (click)="resetNames()"
  ></button>
  <button aria-label="Set titles size" class="tabs_set-size" (click)="setDefaultTabTitlesSize()">
    {{ setSizeButtonName | uppercase }}
  </button>
  @let buttonAddTabName = tabsStateService.addTabState() === true ? 'Add tab' : 'Delete tab';
  <button (click)="addDeleteTab()" aria-label="Add tab" class="tabs_add-tab">
    {{ buttonAddTabName | uppercase }}
  </button>
  @let buttonTabsEditor = 'Tabs editor';
  <button (click)="openEditor()" aria-label="Tabs editor" class="tabs_editor">
    {{ buttonTabsEditor | uppercase }}
  </button>
</div>
