<ng-template #ingredientsDescription>
  @if (displayedText().length !== 0) {
    <div class="ingredient_self-typed-text" [style.--ingredient-color]="ingredientTextColor()">
      <span
        class="material-symbols-outlined ingredients_text-close"
        aria-label="Закрыть описание"
        (click)="closeIngredientText($event)"
      >
        close
      </span>

      <p>{{ displayedText() }}</p>
    </div>
  }
</ng-template>
<div #sceneContainer class="scene-container">
  @if (isBrowser) {
    <canvas #canvas id="canvas" class="store"></canvas>
  }
  <ng-container *ngTemplateOutlet="ingredientsDescription"></ng-container>
  <div
    class="chemistry-ingredients"
    [class.chemistry-ingredients--positioned]="chemistryIngredientsPositioned()"
  >
    @for (ingredient of labIngredients; track ingredient.name) {
      <div
        class="chemistry-ingredients__item"
        role="button"
        tabindex="0"
        [attr.aria-label]="ingredient.name"
        [title]="ingredient.name"
        [style.--ingredient-color]="ingredient.color"
        (click)="onIngredientClick(ingredient.description, ingredient.color, $event)"
      >
        <img [src]="ingredient.image" [alt]="ingredient.name" />
      </div>
    }
  </div>
</div>
