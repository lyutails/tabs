<div class="slider_wrapper">
  @for (result of results(); track result) {
    <div class="slider_card" (click)="openProductModal(result)">
      <div>{{ result.brand.name }}</div>
      <img class="slider_card-image" [src]="result.listingImage.url" />
    </div>
  }
</div>
@if (isOpenModal() === true) {
    <tabs-products-modal
    [brandName]="currentResult?.brand.name"></tabs-products-modal>
}
