<div class="slider_wrapper">
  @for (result of results(); track result) {
    <div class="slider_card" (click)="openProductModal(result)">
      <div>{{ result.brand.name }}</div>
      <img class="slider_card-image" [src]="result.listingImage.url" />
    </div>
  }
</div>
@if (modalStateService.isOpenModal() === true) {
  <tabs-products-modal
    [name]="currentResult?.name"
    [brandName]="currentResult?.brand.name"
    [image]="currentResult?.listingImage.url"
    [price]="currentResult?.price.formattedValue"
  ></tabs-products-modal>
}
