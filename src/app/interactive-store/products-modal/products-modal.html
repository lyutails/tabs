<div class="product_card">
  <button class="product_close-button" (click)="closeModal()">
    <span class="material-symbols-outlined cross">close</span>
  </button>
  <div class="product_brand">{{ brandName() }}</div>
  <div class="product_name">{{ name() }}</div>
  <img class="product_card-image" [src]="image()" />
  <div class="product_price">{{ price() }}</div>
  <button class="product_cart-button">Add to cart</button>
</div>
