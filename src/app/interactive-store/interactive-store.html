<div #sceneContainer class="scene-container"
  (click)="onSceneClick($event)">
  @if (isBrowser) {
    <canvas #canvas id="canvas" class="store"></canvas>
  }
  <tabs-products-slider
    (click)="$event.stopPropagation()"
    [style.left.px]="sliderX()"
    [style.top.px]="sliderY()"
    [class.slider-hidden]="!isProductSliderOpen()"
  ></tabs-products-slider>
</div>
@if (modalStateService.isOpenModal() === true) {
  <tabs-products-modal
    [name]="productsSlider()?.currentResult?.name"
    [brandName]="productsSlider()?.currentResult?.brand.name"
    [image]="productsSlider()?.currentResult?.listingImage.url"
    [price]="productsSlider()?.currentResult?.price.formattedValue"
  ></tabs-products-modal>
}
@if (modalStateService.isOpenModal() === true) {
  <div class="modal_overlay"></div>
}
