<div class="search_control-wrapper">
  <div class="search_button-input">
    <button
      matButton="filled"
      type="button"
      (click)="searchPopular()"
      class="search_popular-button"
    >
      Search Popular
    </button>
    <input
      [value]="brandName()"
      (input)="onInput($event)"
      #input
      placeholder="Search"
      class="search_form-input"
    />
  </div>
  <div class="search_suggestions-wrapper">
    @if (isHiddenSliderArrows()) {
      <button
        type="button"
        class="search_suggestions-arrow left"
        (click)="scrollSuggestions('left')"
      >
        <mat-icon>arrow_left</mat-icon>
      </button>
    }
    <div class="search_suggestions" #suggestions>
      @if (brandName() !== '') {
        @for (brand of brandSuggestions(); track brand) {
          <button
            matButton="elevated"
            type="button"
            (click)="searchBrand(brand)"
            class="search_brand-button"
          >
            {{ brand }}
          </button>
        }
      }
    </div>
    @if (isHiddenSliderArrows()) {
      <button
        type="button"
        class="search_suggestions-arrow right"
        (click)="scrollSuggestions('right')"
      >
        <mat-icon>arrow_right</mat-icon>
      </button>
    }
  </div>
</div>
