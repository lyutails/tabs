@let projectName = 'beauty TABS';

<h1 class="let-title" tabsTitleHighlight animate.enter="fade-in" (click)="navigate('')">
  {{ projectName }}
</h1>
<div class="header_logo" (click)="navigate('')">
  <span class="header_logo-image"></span>
  <span class="header_logo-name">冬</span>
</div>
<div class="header_buttons">
  <button [style.background]="'transparent'" matTooltip="Go to liked" (click)="navigate('liked')">
    <mat-icon>favorite</mat-icon>
  </button>
  <button [style.background]="'transparent'" matTooltip="Buy selected" (click)="navigate('buy')">
    <mat-icon>shopping_cart</mat-icon>
  </button>
  <button class="theme-button" (click)="themeService.toggleTheme()">
    <mat-icon class="theme-icon">{{
      themeService.theme() === 'light' ? 'light_mode' : 'dark_mode'
    }}</mat-icon>
  </button>
</div>
