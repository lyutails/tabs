<div class="header_logo" (click)="navigate('')" tabsTitleHighlight>
  <span class="header_logo-image"></span>
  @let projectName = 'beautyTABS';
  <h1 class="let-title" animate.enter="fade-in">
    {{ projectName }}
  </h1>
</div>

@if (!isMobile) {
  <ng-container *ngTemplateOutlet="headerTemplate"></ng-container>
} @else {
  <ng-container *ngTemplateOutlet="headerTemplate"></ng-container>
  <button class="burger_button" (click)="toggleBurgerMenu()" #burger>
    <span class="material-symbols-outlined">{{ isBurgerOpen() ? 'close' : 'menu' }}</span>
  </button>
  <div
    (click)="isBurgerOpen.set(false)"
    class="burger_overlay"
    [style.transform]="isBurgerOpen() ? 'translateX(0%)' : 'translateX(100%)'"
  ></div>
}

<ng-template #headerTemplate>
  <div class="header_buttons" [class.openBurger]="isBurgerOpen()">
    <button
      class="header_button"
      [style.background]="'transparent'"
      (click)="navigate('search')"
      aria-label="navigates to search page"
    >
      <span class="material-symbols-outlined"> search </span>
    </button>
    <button
      class="header_button"
      [style.background]="'transparent'"
      (click)="navigate('liked')"
      aria-label="navigates to favourites page"
    >
      <span class="material-symbols-outlined"> favorite </span>
      @if (searchStore.likedResults().length > 0) {
        <span class="header_products-count">{{ searchStore.likedResults().length }}</span>
      }
    </button>
    <button
      class="header_button"
      [style.background]="'transparent'"
      (click)="navigate('buy')"
      aria-label="navigates to buy page where you can pay for products"
    >
      <span class="material-symbols-outlined">shopping_cart</span>
      @if (buyStore.buyResults().length > 0) {
        <span class="header_products-count">{{ buyStore.buyResults().length }}</span>
      }
    </button>
    <button
      class="header_button"
      [style.background]="'transparent'"
      (click)="navigate('profile')"
      aria-label="navigates to profile page"
    >
      @if (profileService.isUploaded()) {
        <img class="header_profile-img" [src]="profileService.previewUrl()" />
      } @else {
        <span class="material-symbols-outlined">person</span>
      }
    </button>
    <button
      aria-label="shows or hides promo running line"
      class="header_adv-toggle"
      matTooltip="on/off promo"
      (click)="advertismentService.toggleAdvertisment()"
    >
      <span class="material-symbols-outlined">{{
        advertismentService.isAdvertisment() === true ? 'check' : 'remove'
      }}</span>
    </button>
    <button
      class="header_button theme-button"
      (click)="themeService.toggleTheme()"
      aria-label="switch theme"
    >
      <span class="material-symbols-outlined">{{
        themeService.theme() === 'light' ? 'light_mode' : 'dark_mode'
      }}</span>
    </button>
  </div>
  <div class="header_buttons-background" [class.openBurgerBack]="isBurgerOpen()"></div
></ng-template>
