<div class="profile_avatar">
  <p>Your avatar</p>
  <div class="profile_upload-area" [class.uploaded]="profileService.isUploaded()">
    <input #fileInput type="file" accept="image/*" hidden (change)="onFileSelected($event)" />
    @if (profileService.previewUrl(); as url) {
      <img class="profile_upload-img" [src]="url" alt="Preview" />
    }
  </div>
  <button type="button" class="profile_upload-button" (click)="fileInput.click()">
    Select image
  </button>
</div>
<div class="profile_info">
  <label>Your email</label>
  <input />
  <label>Your name</label>
  <input />
</div>
